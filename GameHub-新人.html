const $=id=>document.getElementById(id);let game='星港远征',imported=false,trial=false,collected=false,running=false,timer,focusBefore;function toast(t){$('toast').textContent=t;$('toast').hidden=false;clearTimeout(timer);timer=setTimeout(()=>$('toast').hidden=true,3000)}function go(id){$(id).scrollIntoView({behavior:'smooth'})}function modal(t,b){focusBefore=document.activeElement;$('title').textContent=t;$('body').innerHTML=b;$('overlay').hidden=false;document.querySelector('.close').hidden=running;document.querySelector('.modal').focus();document.body.style.overflow='hidden'}function closeModal(){if(running)return;$('overlay').hidden=true;document.body.style.overflow='';focusBefore?.focus()}$('overlay').onclick=e=>{if(e.target===$('overlay'))closeModal()};document.onkeydown=e=>{if($('overlay').hidden)return;if(e.key==='Escape')closeModal();if(e.key==='Tab'){const a=[...document.querySelector('.modal').querySelectorAll('button:not([hidden]),input,select')];if(!a.length){e.preventDefault();return}const i=a.indexOf(document.activeElement);e.preventDefault();a[(i+(e.shiftKey?-1:1)+a.length)%a.length].focus()}};
function initial(){$('hero').innerHTML='<div class="eyebrow">● 准备好，开启你的第一场游戏</div><div class="symbol">＋</div><h1>导入你的第一款 PC 游戏</h1><p>支持 .exe / 文件夹导入，<br>自动检测并生成推荐配置</p><button class="primary" onclick="files()">＋ 选择本地游戏</button><div class="steps">① 导入 → ② 检测 → ③ 一键启动</div><p class="note">无需登录即可试用，配置可随时调整</p><button class="text" onclick="go(\'recommend\')">先看看我的设备能玩什么 ›</button>'}function device(){modal('设备检测信息','<dl><dt>CPU</dt><dd>骁龙 8 Gen2</dd><dt>GPU</dt><dd>Adreno 740</dd><dt>内存</dt><dd>12 GB / 可用 7.8 GB</dd><dt>推荐驱动</dt><dd>Turnip</dd><dt>兼容结论</dt><dd class="green">适合运行轻度 3D 游戏</dd></dl><p>Android 14 · 示例设备数据</p><button class="primary" onclick="closeModal();go(\'recommend\')">查看可玩推荐</button>')}function files(){modal('选择本地游戏','<p>本地文件 · 示例游戏</p>'+['星港远征','像素地牢'].map(n=>'<button class="file" onclick="choose(\''+n+'\')">🎮 '+n+'.exe<small>PC 游戏可执行文件 · 点击导入</small></button>').join(''))}function choose(n){game=n;imported=true;closeModal();tasks();ready();toast('检测完成，推荐配置已生成')}function ready(){$('hero').innerHTML='<div class="eyebrow">✓ 设备与游戏检测完成</div><div class="symbol">🎮</div><h1>推荐配置已生成</h1><p style="color:white">'+game+'</p><div class="chips"><span>DXVK 2.3</span><span>Box64 预设中</span><span>Turnip 驱动</span></div><button class="primary" onclick="launch()">使用推荐配置启动</button><button class="text" onclick="adjust()">手动调整配置</button>'}function adjust(){modal('手动调整配置','<p>图形翻译 <select id="dx"><option>DXVK 2.3</option><option>DXVK 2.2</option></select></p><p>Box64 预设 <select id="box"><option>中</option><option>高兼容</option><option>高性能</option></select></p><p><label><input id="turnip" type="checkbox" checked> Turnip 驱动</label></p><button class="primary" onclick="save()">保存配置</button>')}function save(){const values=[$('dx').value,'Box64 预设'+$('box').value,$('turnip').checked?'Turnip 驱动':'默认驱动'];document.querySelectorAll('.chips span').forEach((s,i)=>s.textContent=values[i]);closeModal();toast('自定义配置已保存')}async function launch(){running=true;modal('正在启动 '+game,'<p id="stage">环境准备</p><div class="bar"><div class="fill" id="fill"></div></div><div class="stages"><span>① 环境准备</span><span>② 图形翻译</span><span>③ 游戏启动</span></div>');for(let i=0;i<3;i++){$('stage').textContent=['环境准备','图形翻译','游戏启动'][i];await new Promise(r=>setTimeout(r,40));$('fill').style.width=(i+1)/3*100+'%';await new Promise(r=>setTimeout(r,1000))}running=false;closeModal();complete();toast('《'+game+'》首次启动成功')}function complete(){$('hero').innerHTML='<div class="eyebrow">● 首次启动成功</div><div class="symbol green">✓</div><h1>入驻完成</h1><p>'+game+'</p><p class="green">✓ 已收藏到游戏库<br>✓ 推荐配置已保存</p><div class="actions"><button onclick="go(\'community\')">查看该游戏社区最佳配置</button><button onclick="toast(\'云存档已开启（演示）\')">开启云存档</button><button onclick="toast(\'演示占位：游戏讨论\')">加入该游戏讨论</button><button class="primary" onclick="veteran()">进入老用户首页演示 →</button></div>'}function veteran(){$('hero').innerHTML='<div class="eyebrow">欢迎回来 · 游戏空间</div><h1>继续你的游戏</h1><div class="symbol">🎮</div><h3>'+game+'</h3><p>最近游玩 · 配置已保存</p><button class="primary" onclick="launch()">继续启动</button><button class="text" onclick="files()">＋ 导入其他游戏</button><p>极速环线 · 待导入</p>';window.scrollTo({top:0,behavior:'smooth'});toast('已切换为老用户首页')}function apply(){collected=true;tasks();toast('已应用社区配置，启动成功率提升')}function diagnose(){modal('启动黑屏 · 诊断结果','<pre>[Device] Snapdragon 8 Gen2 / Adreno 740\n[Graphics] Vulkan 初始化成功\n[Warning] 默认驱动兼容性异常\n[Advice] 切换 Turnip + DXVK 2.3</pre><p>检测到图形驱动兼容问题，建议应用当前设备推荐配置。</p><button class="primary" onclick="closeModal();apply()">应用推荐配置</button>')}function claim(){trial=true;tasks();modal('云游戏试用','<p style="color:white">已领取 30 分钟云游戏试用</p><p>可在云端体验「极速环线」等游戏。</p><button class="primary" onclick="closeModal();toast(\'演示占位：云游戏页\')">去云游戏页</button>')}function tasks(){const rows=[['完成一次游戏导入',imported,'去导入','files()'],['试用云游戏',trial,'去试用',"go('cloud');toast('点击领取试用，体验云游戏')"],['收藏一个社区配置',collected,'去收藏',"go('community');toast('点击一键应用，收藏社区配置')"]];$('tasks').innerHTML=rows.map(r=>'<div class="task"><span class="'+(r[1]?'green <style>
.platform-library{display:flex;align-items:center;justify-content:center;gap:5px;width:100%;margin-top:9px;padding:6px;background:#ffffff07;border:1px solid #c0b2e527;border-radius:6px;color:#cec6e3;font-size:10px}.library-options{display:grid;grid-template-columns:1fr 1fr;gap:10px}.library-options button{padding:17px 8px;background:#292b38;font-weight:600}.library-options small{display:block;color:#969daf;font-size:10px;font-weight:400;margin-top:4px}.library-game{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid #ffffff12}.library-game input{accent-color:#ac93ed}.library-game span{flex:1;font-size:12px}.library-game small{display:block;color:#939bad;font-size:10px}.library-disclaimer{font-size:10px;color:#929bad;line-height:1.8}

<script>
function addLibraryEntry(){const hero=document.getElementById('hero');if(!hero||hero.querySelector('.platform-library'))return;const button=document.createElement('button');button.className='platform-library';button.textContent='从 Steam / Epic 读取游戏库';button.onclick=selectLibrary;hero.append(button)}
function selectLibrary(){modal('读取平台游戏库','<p class="library-disclaimer">演示流程：使用示例游戏库，无需账号或密码。正式接入需平台授权或本地客户端支持，读取记录不代表已下载游戏或拥有运行授权。</p><div class="library-options"><button onclick="readLibrary(\'Steam\')">Steam<small>读取示例游戏库</small></button><button onclick="readLibrary(\'Epic\')">Epic Games<small>读取示例游戏库</small></button></div>')}
function readLibrary(platform){const games=platform==='Steam'?['星港远征','像素地牢','极速环线']:['极速环线','星港远征'];modal(platform+' 游戏库','<p class="library-disclaimer">已读取 '+games.length+' 款示例游戏。选择一款已在本地安装的游戏，检测并生成配置。</p><form onsubmit="importLibraryGame(event)">'+games.map((name,i)=>'<label class="library-game"><input type="radio" name="libraryGame" value="'+name+'" '+(i===0?'checked':'')+'><span>'+name+'<small>'+(i===0?'已发现本地安装 · 示例':'需要选择本地 .exe · 示例')+'</small></span></label>').join('')+'<button class="primary" type="submit">导入所选游戏</button></form>')}
function importLibraryGame(event){event.preventDefault();const selected=event.target.querySelector('input:checked');const first=event.target.querySelector('input');if(selected===first){choose(selected.value);toast('已读取本地安装位置并生成推荐配置（演示）')}else{const name=selected.value;modal('选择本地游戏文件','<p class="library-disclaimer">已读取「'+name+'」的游戏库记录，尚未发现本地安装。正式使用时需选择该游戏的本地可执行文件。</p><button class="file" id="libraryExe"></button>');const exe=document.getElementById('libraryExe');exe.textContent='选择示例文件：'+name+'.exe';exe.onclick=()=>choose(name)}}
addLibraryEntry();
new MutationObserver(addLibraryEntry).observe(document.getElementById('hero'),{childList:true});
</script>

const playTabs=document.createElement('div');playTabs.className='play-tabs';playTabs.setAttribute('role','tablist');playTabs.setAttribute('aria-label','游戏方式');
playTabs.innerHTML='<button id="cloudPlayTab" role="tab" aria-selected="true" aria-controls="cloudPlayPanel">云游戏</button><button id="streamPlayTab" role="tab" aria-selected="false" aria-controls="streamPlayPanel" tabindex="-1">串流</button>';

function setupTextTabs(list,panels){const tabs=[...list.querySelectorAll('button')];list.setAttribute('role','tablist');tabs.forEach((tab,i)=>{tab.setAttribute('role','tab');tab.setAttribute('aria-selected',String(i===0));tab.tabIndex=i===0?0:-1;function activate(){tabs.forEach((t,j)=>{const active=i===j;t.classList.toggle('active',active);t.setAttribute('aria-selected',String(active));t.tabIndex=active?0:-1;panels[j].hidden=!active})}tab.onclick=activate;tab.onkeydown=e=>{let next;if(e.key==='ArrowRight')next=(i+1)%tabs.length;else if(e.key==='ArrowLeft')next=(i-1+tabs.length)%tabs.length;else if(e.key==='Home')next=0;else if(e.key==='End')next=tabs.length-1;else return;e.preventDefault();tabs[next].click();tabs[next].focus()}})}

setupTextTabs(document.querySelector('.offer-tabs'),[document.getElementById('steamPanel'),document.getElementById('freePanel')]);
